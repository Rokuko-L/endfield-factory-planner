<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endfield Factory Planner</title>
  </head>
  <body>
    <header class="toolbar">
      <h1>Endfield Factory Planner</h1>
      <label class="field">
        Machine
        <select id="machine-select"></select>
      </label>
      <div class="field">
        Orientation
        <strong id="orientation-label">0°</strong>
      </div>
      <button id="mode-place" type="button" class="mode active">Place</button>
      <button id="mode-connect" type="button" class="mode">Connect</button>
      <button id="clear-connections" type="button">Clear Connections</button>
      <button id="clear-all" type="button">Clear All</button>
      <button id="define-machines" type="button">Define Machines</button>
    </header>

    <main class="layout">
      <div class="grid-wrap">
        <canvas id="grid"></canvas>
      </div>
      <aside class="panel">
        <p id="status" class="status">Ready. Pick a machine and click the grid.</p>
        <p id="metrics" class="metrics"></p>
        <p class="hint" id="hint">
          Place: click · R: rotate · right-click: remove
        </p>
        <button id="demo-lc-valley" type="button">Demo: LC Valley Battery</button>
      </aside>
      <div id="recipe-info" class="recipe-info" aria-live="polite"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
